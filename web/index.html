<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#11232b">
  <meta name="description" content="Luna 城市生活：探索街区、认识市民、完成任务和换装。离线开放世界原型。">
  <title>Luna · 城市生活</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2311232b'/%3E%3Cpath d='M9 8v17h15' stroke='%238bddca' stroke-width='3' fill='none'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main id="app">
    <canvas id="scene" aria-label="城市生活游戏场景"></canvas>
    <div id="hud" hidden>
      <div class="vitals"><span>HP <b id="hp">100</b></span><div class="meter"><i id="hp-fill"></i></div><span>体力 <b id="stamina">100</b></span><div class="meter stamina"><i id="stamina-fill"></i></div></div>
      <div class="status"><strong id="money">¥ 500</strong><span id="game-time">12:00</span><button id="pause" aria-label="暂停游戏">Ⅱ</button></div>
      <div id="location">出生公寓</div>
      <div id="objective"><b id="mission-name">在城市开始新生活</b><span id="mission-step">到公寓门口，进入街区</span></div>
      <div id="motion-state">待机</div>
      <div class="control-deck">
        <div id="joystick" aria-label="移动摇杆" role="group"><div class="stick-guides"></div><div id="stick-knob"></div></div>
        <div class="action-buttons"><button id="aim" aria-pressed="false">瞄准</button><button id="interact" hidden>互动</button><button id="run" aria-pressed="false">跑步</button></div>
      </div>
      <span class="control-help">左摇杆移动 · 右侧拖动视角</span>
    </div>
    <section id="main-menu" class="main-menu" hidden>
      <span class="eyebrow">LUNA / CITY LIFE</span><h1>城市生活</h1><p>一间公寓，一座街区。<br>从这里开始你的新生活。</p>
      <div class="menu-actions"><button id="continue-game" class="primary" disabled>继续游戏</button><button id="new-game">新的生活</button><button id="main-settings">设置</button></div>
      <small>开放世界原型 V1 · 离线游玩</small>
    </section>
    <div id="modal" class="modal" hidden><section class="panel"><header><div><span class="eyebrow" id="panel-kicker">LUNA CITY</span><h2 id="panel-title">暂停</h2></div><button id="close-panel" aria-label="关闭">×</button></header><div id="panel-content"></div></section></div>
    <div id="toast" role="status" hidden></div>
    <div id="loading" class="loading" role="status"><div class="spinner"></div><strong>正在准备城市生活</strong><p id="load-detail">读取离线场景和人物</p><div class="load-track"><div id="load-progress"></div></div><button id="retry" hidden>重新加载</button></div>
  </main>
  <script type="module" src="./app.js?v=life-v1"></script>
</body>
</html>
