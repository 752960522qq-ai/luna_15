<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#101b27">
  <meta name="description" content="使用摇杆测试人物的高跟鞋走路、跑步和转向。">
  <title>高跟鞋 · 人物移动测试</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23101b27'/%3E%3Ccircle cx='16' cy='16' r='10' fill='none' stroke='%2371dbc9' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='4' fill='%2371dbc9'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main id="app">
    <canvas id="scene" aria-label="人物移动测试场景"></canvas>
    <header class="topbar">
      <div class="title"><span class="mark" aria-hidden="true">H</span><div><h1>人物移动测试</h1><p>高跟鞋步态</p></div></div>
      <div class="toolbar"><button id="aim" aria-label="步枪瞄准待机" aria-pressed="false" title="静止时切换步枪瞄准姿态">瞄准待机</button><button id="foot-view" aria-pressed="false">脚部视角</button><button id="reset" title="回到起点">重置</button></div>
    </header>
    <aside class="telemetry" aria-label="移动状态">
      <span id="motion-state" aria-live="polite">加载中</span><strong><span id="speed">0.00</span><small>m/s</small></strong>
      <div class="speed-meter"><div id="speed-fill"></div></div>
    </aside>
    <div id="loading" class="loading" role="status"><div class="spinner"></div><strong>正在载入人物</strong><p id="load-detail">模型与动画准备中</p><div class="load-track"><div id="load-progress"></div></div><button id="retry" hidden>重新加载</button></div>
    <div class="help">左侧摇杆移动 · 右侧拖动视角<span>WASD / 方向键 · Shift 跑步</span></div>
    <div class="control-deck">
      <div class="stick-wrap"><div id="joystick" role="group" aria-label="移动摇杆"><div class="stick-guides" aria-hidden="true"></div><div id="stick-knob"></div></div><span class="control-label">移动</span></div>
      <div class="run-wrap"><button id="run" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="14.5" cy="4.5" r="2"/><path d="m8 9 4-2 4 3 4 1m-8-4-2 7 5 3 1 4m-6-7-3 5-4 1"/></svg><span>跑步</span></button><span class="control-label" id="run-hint">点击切换</span></div>
    </div>
    <div class="ground-note">1 格 = 1 米</div>
  </main>
  <script type="module" src="./app.js?v=motion-4-v2"></script>
</body>
</html>
