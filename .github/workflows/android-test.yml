name: Build and test Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check offline assets and joystick movement
        run: |
          mkdir -p reports
          python3 scripts/prepare_assets.py
          python3 scripts/check_web.py | tee reports/offline-assets.json
          node scripts/check_movement.mjs | tee reports/movement.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
      - name: Install Android platform and build tools
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
      - name: Build test application and instrumentation APK
        run: bash android/gradlew -p android --no-daemon assembleDebug assembleDebugAndroidTest lintDebug
      - name: Verify package, signature, and bundled model
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK" | tee reports/signature.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee reports/package.txt
          python3 scripts/check_apk.py "$APK" | tee reports/apk.json
          mkdir -p artifacts
          cp "$APK" artifacts/luna15-heel-motion-test-v1.apk
          cp android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk artifacts/instrumentation.apk
      - uses: actions/upload-artifact@v4
        with:
          name: luna15-heel-motion-test-v1
          path: |
            artifacts/*.apk
            reports/
          if-no-files-found: error
          retention-days: 30

  emulator:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: luna15-heel-motion-test-v1
          path: download
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install and test offline model loading and touch movement
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            mkdir -p reports
            adb install download/artifacts/luna15-heel-motion-test-v1.apk
            adb install download/artifacts/instrumentation.apk
            adb shell svc wifi disable
            adb shell svc data disable
            adb shell am instrument -w -r com.luna.heelmotion.test/androidx.test.runner.AndroidJUnitRunner | tee reports/instrumentation.txt
            adb logcat -d -s HeelMotionWeb AndroidRuntime > reports/webview-log.txt
            grep -q 'OK (1 test)' reports/instrumentation.txt
            adb exec-out run-as com.luna.heelmotion cat files/test-preview.png > reports/test-preview.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: luna15-emulator-results
          path: reports/
          if-no-files-found: warn
          retention-days: 30
